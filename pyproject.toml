[project]
name = "timefence"
version = "0.1.0"
description = "A-share factor-mining multi-agent system that cannot see the future"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "openai>=1.40",
    "langgraph>=0.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
data = ["akshare>=1.15"]

[project.scripts]
timefence = "timefence.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timefence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Layering rule: upper layers may import lower layers, never the reverse.
[tool.importlinter]
root_package = "timefence"

[[tool.importlinter.contracts]]
name = "Layers only depend downward"
type = "layers"
layers = [
    "timefence.cli",
    "timefence.experiments",
    "timefence.agents",
    "timefence.strategy",
    "timefence.backtest | timefence.factors",
    "timefence.data",
    "timefence.core",
]
